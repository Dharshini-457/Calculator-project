<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Function Plotter 📈</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        input, select, button, textarea { margin: 10px 0; padding: 8px; width: 100%; }
        #plot { width: 100%; height: 500px; margin-top: 20px; }
        #result { margin-top: 20px; font-size: 18px; color: #333; }
    </style>
</head>
<body>

<h1>Function Plotter 📈</h1>

<label for="functionInput">Enter a function of x:</label>
<textarea id="functionInput" rows="3" placeholder="Example: sin(x) + x^2"></textarea>

<label for="choice">Choose what to plot:</label>
<select id="choice">
    <option value="original">Original Function</option>
    <option value="derivative">Derivative</option>
    <option value="integral">Integral</option>
</select>

<div id="bounds" style="display: none;">
    <label for="lowerBound">Lower bound (a):</label>
    <input type="number" id="lowerBound" value="0">

    <label for="upperBound">Upper bound (b):</label>
    <input type="number" id="upperBound" value="10">
</div>

<button onclick="plotFunction()">Plot</button>

<div id="plot"></div>
<div id="result"></div>

<script>
// Show bounds input only when "Integral" is selected
document.getElementById('choice').addEventListener('change', function () {
    const boundsDiv = document.getElementById('bounds');
    boundsDiv.style.display = (this.value === 'integral') ? 'block' : 'none';
});

function plotFunction() {
    const exprInput = document.getElementById('functionInput').value.trim();
    const choice = document.getElementById('choice').value;
    const lowerBound = parseFloat(document.getElementById('lowerBound').value);
    const upperBound = parseFloat(document.getElementById('upperBound').value);
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '';  // Clear previous result

    if (!exprInput) {
        alert('Please enter a function!');
        return;
    }

    try {
        let expr = exprInput;
        let label = `f(x) = ${exprInput}`;

        if (choice === 'derivative') {
            expr = math.derivative(exprInput, 'x').toString();
            label = `f'(x) = ${expr}`;
        } else if (choice === 'integral') {
            expr = math.integral(exprInput, 'x').toString(); // << symbolic integral
            label = `∫f(x)dx = ${expr}`;
        }


        const compiled = math.compile(exprInput);

        // Prepare x and y values
        const x_vals = [];
        const y_vals = [];

        for (let x = -10; x <= 10; x += 0.05) {
            try {
                let y;
                if (choice === 'original') {
                    y = compiled.evaluate({x});
                } else if (choice === 'derivative') {
                    const derivativeCompiled = math.compile(expr);
                    y = derivativeCompiled.evaluate({x});
                } else if (choice === 'integral') {
                    y = numericalIntegral(exprInput, 0, x); // integral from 0 to x
                }

                if (isFinite(y)) {
                    x_vals.push(x);
                    y_vals.push(y);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // Plot the function
        Plotly.newPlot('plot', [{
            x: x_vals,
            y: y_vals,
            mode: 'lines',
            name: label,
            line: {color: 'teal'}
        }], {
            title: label,
            xaxis: {title: 'x'},
            yaxis: {title: 'y'},
            grid: {visible: true}
        });

        // Show definite integral if selected
        if (choice === 'integral') {
            const totalIntegral = numericalIntegral(exprInput, lowerBound, upperBound);
            resultDiv.innerHTML = `
                <strong>Definite Integral:</strong><br>
                ∫ from ${lowerBound} to ${upperBound} ≈ <b>${totalIntegral.toFixed(6)}</b>
            `;
        }

    } catch (err) {
        alert('Invalid expression! Please try again.');
        console.error(err);
    }
}

// Simple trapezoidal rule for numeric integration
function numericalIntegral(exprInput, a, b) {
    const compiled = math.compile(exprInput);
    const n = 500; // more points = better accuracy
    const h = (b - a) / n;
    let sum = 0.5 * (compiled.evaluate({x: a}) + compiled.evaluate({x: b}));

    for (let i = 1; i < n; i++) {
        const xi = a + i * h;
        sum += compiled.evaluate({x: xi});
    }

    return sum * h;
}
</script>

</body>
</html>
