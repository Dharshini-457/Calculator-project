<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Function Plotter 📈</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("calculator.png");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            background: rgba(74, 23, 28, 0.9);
            max-width: 700px;
            width: 100%;
            padding: 30px;
            margin: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }

        h1, h3 {
            text-align: center;
            color: white;
        }

        input, select, button, textarea {
            margin: 10px 0;
            padding: 8px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #plot {
            width: 100%;
            height: 500px;
            margin-top: 20px;
            background: white;
            border-radius: 8px;
        }

        label {
            color: white;
            font-weight: bold;
        }

        #symbolicOutput {
            color: white;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }

        #orderContainer,
        #integralLimits {
            display: none;
        }

        #historyList li {
            margin-bottom: 6px;
            cursor: pointer;
        }

        #historyList li:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Function Plotter 📈</h1>

    <label for="functionInput">Enter a function of x:</label>
    <textarea id="functionInput" rows="3" placeholder="Example: sin(x) + x^2"></textarea>

    <label for="choice">What do you want to plot?</label>
    <select id="choice">
        <option value="original">Original Function</option>
        <option value="derivative">Derivative</option>
        <option value="integral">Integral</option>
    </select>

    <div id="orderContainer">
        <label for="orderInput">Order (for derivatives):</label>
        <input type="number" id="orderInput" value="1" min="1" />
    </div>

    <div id="integralLimits">
        <label for="lowerLimit">Lower Limit (a):</label>
        <input type="number" id="lowerLimit" value="0" />
        <label for="upperLimit">Upper Limit (b):</label>
        <input type="number" id="upperLimit" value="10" />
    </div>

    <button onclick="plotFunction()">Plot</button>

    <div id="plot"></div>
    <div id="symbolicOutput"></div>

    <div id="historySection">
        <h3>History</h3>
        <ul id="historyList" style="color: white; padding-left: 20px;"></ul>
        <button onclick="clearHistory()" style="margin-top: 10px;">Clear History</button>
    </div>
</div>

<script>
    let history = JSON.parse(localStorage.getItem('functionPlotHistory')) || [];

    document.getElementById('choice').addEventListener('change', function () {
        const orderContainer = document.getElementById('orderContainer');
        const integralLimits = document.getElementById('integralLimits');

        if (this.value === 'derivative') {
            orderContainer.style.display = 'block';
            integralLimits.style.display = 'none';
        } else if (this.value === 'integral') {
            orderContainer.style.display = 'none';
            integralLimits.style.display = 'block';
        } else {
            orderContainer.style.display = 'none';
            integralLimits.style.display = 'none';
        }
    });

    function saveHistory() {
        localStorage.setItem('functionPlotHistory', JSON.stringify(history));
    }

    function updateHistoryDisplay() {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '';

        history.slice().reverse().forEach(entry => {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${entry.type.charAt(0).toUpperCase() + entry.type.slice(1)}:</strong> ${entry.label}`;
            li.title = `Function: ${entry.expression}`;
            li.onclick = () => {
                document.getElementById('functionInput').value = entry.expression;
                document.getElementById('choice').value = entry.type;
                document.getElementById('choice').dispatchEvent(new Event('change'));
                plotFunction();
            };
            historyList.appendChild(li);
        });
    }

    function plotFunction() {
        const exprInput = document.getElementById('functionInput').value;
        const choice = document.getElementById('choice').value;
        const order = parseInt(document.getElementById('orderInput').value) || 1;
        const lower = parseFloat(document.getElementById('lowerLimit').value) || 0;
        const upper = parseFloat(document.getElementById('upperLimit').value) || 10;
        const symbolicOutput = document.getElementById('symbolicOutput');
        symbolicOutput.innerText = '';

        if (!exprInput) {
            alert('Please enter a function!');
            return;
        }

        let expr = exprInput;
        let label = `f(x) = ${exprInput}`;

        try {
            if (choice === 'derivative') {
                for (let i = 0; i < order; i++) {
                    expr = math.derivative(expr, 'x').toString();
                }
                label = `f<sup>(${order})</sup>(x) = ${expr}`;
            } else if (choice === 'integral') {
                symbolicOutput.innerText = `Numerical integration from a = ${lower} to b = ${upper}`;
                label = `∫f(x)dx (from ${lower} to ${upper})`;
            }

            const compiled = math.compile(expr);
            const x_vals = [], y_vals = [];

            for (let i = -10; i <= 10; i += 0.05) {
                try {
                    let y;
                    if (choice === 'original' || choice === 'derivative') {
                        y = compiled.evaluate({x: i});
                    } else if (choice === 'integral') {
                        y = repeatedNumericalIntegral(exprInput, lower, i, 1);
                    }

                    if (isFinite(y)) {
                        x_vals.push(i);
                        y_vals.push(y);
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            const trace = {
                x: x_vals,
                y: y_vals,
                mode: 'lines',
                name: label,
                line: {color: 'teal'}
            };

            const layout = {
                title: label,
                xaxis: {title: 'x'},
                yaxis: {title: 'y'}
            };

            Plotly.newPlot('plot', [trace], layout);

            history.push({ expression: exprInput, type: choice, label: label });
            saveHistory();
            updateHistoryDisplay();

        } catch (err) {
            alert('Invalid expression! Please try again.');
            console.error(err);
        }
    }

    function clearHistory() {
        if (confirm("Are you sure you want to clear the history?")) {
            history = [];
            localStorage.removeItem('functionPlotHistory');
            updateHistoryDisplay();
        }
    }

    function numericalIntegral(exprInput, a, b) {
        const compiled = math.compile(exprInput);
        let n = 100;
        let h = (b - a) / n;
        let sum = 0.5 * (compiled.evaluate({x: a}) + compiled.evaluate({x: b}));
        for (let i = 1; i < n; i++) {
            sum += compiled.evaluate({x: a + i * h});
        }
        return sum * h;
    }

    function repeatedNumericalIntegral(expr, a, b, times) {
        if (times <= 1) return numericalIntegral(expr, a, b);

        const dx = 0.1;
        const compiled = math.compile(expr);
        let innerFunc = (x) => compiled.evaluate({x});

        for (let t = 1; t < times; t++) {
            const prevFunc = innerFunc;
            innerFunc = (x) => numericalIntegralFromFunc(prevFunc, a, x, dx);
        }

        return innerFunc(b);
    }

    function numericalIntegralFromFunc(func, a, b, h = 0.1) {
        let n = Math.floor((b - a) / h);
        let sum = 0.5 * (func(a) + func(b));
        for (let i = 1; i < n; i++) {
            sum += func(a + i * h);
        }
        return sum * h;
    }

    updateHistoryDisplay();
</script>
<nav>
    <a class="btn" href="/">Exit</a>
</nav>
</div>

<style>
    
.content {
    text-align: center;
    margin-top: 100px;
}

nav {
    margin-top: 900px;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
}

.btn {
    align-items: end;
    display: inline-block;
    background-color: #beb6c2;
    color: rgb(29, 26, 26);
    padding: 15px 30px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    transition: background-color 0.3s, transform 0.2s;
}

.btn:hover {
    background-color: #849b85;
    transform: scale(1.05);
}

.btn:active {
    transform: scale(0.98);
}
</style>
</body>
</html>
