<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none; /* Let clicks pass through */
        }

        .video-background iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
            border: none;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-shadow: 0 0 10px black;
        }

        nav a {
            margin: 10px;
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/IoSVxLr9K2o?autoplay=1&mute=1&loop=1&playlist=IoSVxLr9K2o&controls=0&showinfo=0&modestbranding=1&rel=0"
            frameborder="0"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>

    <div class="content">
        <h1>Welcome</h1>
        <nav>
            <a href="/ncalc">NORMAL CALCULATOR</a>
            <a href="/calc">CALCULUS CALCULATOR</a>
        </nav>
    </div>
</body>
</html>
