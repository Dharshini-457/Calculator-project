    <style>
        body {
        background-image: url("calculator.png"); /* Path to your image */

    </head>



  
    
    <style type="text/css">
            body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Ensure video stays behind content */
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the video covers the screen without distortion */
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 20px;
        }


        .content {
            text-align: center;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: rgb(24, 21, 24);
            text-shadow: 0 0 10px black;
        }

        nav a {
            margin: 10px;
            color: rgb(72, 172, 211);
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    

    <div class="content">
        <h1>Welcome!🧮
        </h1>
        <nav>
            <a class="btn" href="/ncalc">NORMAL CALCULATOR</a>
            <a class="btn" href="/calc">CALCULUS CALCULATOR</a>
        </nav>
    </div>
    
    <style>
        .content {
            text-align: center;
            margin-top: 100px;
        }
    
        nav {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
    
        .btn {
            display: inline-block;
            background-color: #beb6c2;
            color: rgb(29, 26, 26);
            padding: 15px 30px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.2s;
        }
    
        .btn:hover {
            background-color: #849b85;
            transform: scale(1.05);
        }
    
        .btn:active {
            transform: scale(0.98);
        }
    </style>
