<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Calculator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #06031a;
        }

        #calculator {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0px 15px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 320px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        input[type="text"] {
            width: 100%;
            height: 50px;
            background: #83808e;
            border: none;
            text-align: right;
            font-size: 24px;
            border-radius: 10px;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            outline: none;
        }

        .button {
            width: 70px;
            height: 70px;
            background: #9c99ac;
            border: none;
            border-radius: 50%;
            margin: 10px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        .button:hover {
            background: #420404;
            transform: scale(1.1);
        }

        .button:active {
            transform: scale(0.95);
        }

        #equals {
            background: #5e665f;
            color: white;
        }

        #equals:hover {
            background: #7a8a7a;
        }

        #clear {
            background: #7b5555;
            color: white;
        }

        #clear:hover {
            background: #5e4848;
        }

        #calculator-grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            grid-gap: 10px;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div id="calculator">
        <input type="text" id="result" readonly>
        <div id="calculator-grid">
            <button class="button" onclick="appendNumber('7')">7</button>
            <button class="button" onclick="appendNumber('8')">8</button>
            <button class="button" onclick="appendNumber('9')">9</button>
            <button class="button" onclick="appendNumber('/')">/</button>

            <button class="button" onclick="appendNumber('4')">4</button>
            <button class="button" onclick="appendNumber('5')">5</button>
            <button class="button" onclick="appendNumber('6')">6</button>
            <button class="button" onclick="appendNumber('*')">*</button>

            <button class="button" onclick="appendNumber('1')">1</button>
            <button class="button" onclick="appendNumber('2')">2</button>
            <button class="button" onclick="appendNumber('3')">3</button>
            <button class="button" onclick="appendNumber('-')">-</button>

            <button class="button" onclick="appendNumber('0')">0</button>
            <button class="button" id="clear" onclick="clearDisplay()">C</button>
            <button class="button" id="equals" onclick="calculate()">=</button>
            <button class="button" onclick="appendNumber('+')">+</button>
        </div>
    </div>

    <script>
        function appendNumber(number) {
            document.getElementById('result').value += number;
        }

        function clearDisplay() {
            document.getElementById('result').value = '';
        }

        function calculate() {
            let expression = document.getElementById('result').value;
            try {
                let result = eval(expression);
                document.getElementById('result').value = result;
            } catch (error) {
                document.getElementById('result').value = 'Error';
            }
        }
    </script>
    <div class="content">
    <nav>
        <a class="btn" href="/">EXIT</a>
    </nav>
</div>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f2f4f3;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.calculator {
    margin-top: 50px;
    /* Style your calculator here */
}

.content {
    margin-top: 40px; /* Space between calculator and button */
    text-align: center;
    width: 100%;
}

nav {
    display: flex;
    justify-content: center;
}

.btn {
    display: inline-block;
    background-color: #102411;
    color: white;
    padding: 15px 30px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
    transition: background-color 0.3s ease, transform 0.2s ease;
}

.btn:hover {
    background-color: #29442e;
    transform: scale(1.05);
}

.btn:active {
    transform: scale(0.97);
}
</style>

</body>
</html>
